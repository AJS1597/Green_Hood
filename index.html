<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 8 L74 30 L64 78 L50 92 L36 78 L26 30 Z' fill='%232f9e4f'/%3E%3Cpath d='M50 8 L74 30 L50 40 L26 30 Z' fill='%233fc46a'/%3E%3C/svg%3E"
    />
    <title>Green Hood</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0b1220; }
      #shell { position: relative; width: 100vw; height: 100vh; overflow: hidden;
        display: flex; align-items: center; justify-content: center; }
      #game { display: block; image-rendering: pixelated; }
      #hud {
        position: absolute; inset: 0; pointer-events: none;
        font: 14px/1.5 system-ui, sans-serif; color: #e6edf3;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }
      .brand { position: absolute; top: 14px; left: 16px; }
      .brand h1 { margin: 0; font-size: 20px; letter-spacing: 0.12em; }
      .brand p { margin: 2px 0 0; font-size: 11px; letter-spacing: 0.28em;
        text-transform: uppercase; color: #9fb3cf; }
      .hud-message { position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
        margin: 0; font-size: 16px; color: #ffd23f; }
      .controls { position: absolute; bottom: 14px; left: 16px; display: grid; gap: 4px;
        font-size: 12px; color: #cdd9ea; }
      .controls code { color: #7fe0a0; }
      .fs-btn {
        position: absolute; top: 14px; right: 16px; pointer-events: auto;
        background: rgba(27, 42, 68, 0.85); color: #e6edf3;
        border: 1px solid #3a5480; border-radius: 6px; padding: 6px 10px;
        font: 12px/1 system-ui, sans-serif; cursor: pointer;
      }
      .fs-btn:hover { background: #24395c; }
      kbd {
        display: inline-block; min-width: 14px; padding: 1px 5px; margin: 0 1px;
        background: #1b2a44; border: 1px solid #3a5480; border-radius: 4px;
        font: 11px/1.4 ui-monospace, monospace; text-align: center;
      }
    </style>
  </head>
  <body>
    <main id="shell">
      <canvas id="game" aria-label="Green Hood game canvas"></canvas>

      <div id="hud">
        <header class="brand">
          <h1>GREEN HOOD</h1>
          <p>platformer</p>
        </header>

        <p id="hud-message" class="hud-message"></p>

        <button id="fullscreen-button" class="fs-btn" type="button" title="Fullscreen (F)">
          ⛶ Fullscreen
        </button>

        <aside class="controls" aria-label="Controls">
          <div><kbd>←</kbd><kbd>→</kbd> move <kbd>↑</kbd><kbd>↓</kbd> climb</div>
          <div><kbd>Z</kbd> jump <kbd>X</kbd> sword</div>
          <div><kbd>F</kbd> fullscreen <kbd>R</kbd> restart &nbsp;·&nbsp; edit at <code>/dev</code></div>
        </aside>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
